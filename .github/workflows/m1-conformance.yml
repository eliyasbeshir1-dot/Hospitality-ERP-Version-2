# M1 and M2 conformance workflow.
#
# Replaces the M0R skeleton gate. Migrations, schema and application source are the
# work of M1 and are no longer forbidden; what this pipeline still refuses is fenced
# Phase 2/3 surface, v1.1 inheritance, bypass roles in deployment paths and /docs drift.
#
# Fail-closed per FR-SEC-015: zero results, empty results, skipped results and unknown
# status are FAILURES. A green run with nothing executed is a failure.
#
# The database is a real PostgreSQL service container, and every gate runs through the
# least-privileged application role — never the owner, never a superuser (FR-DAT-017).

name: M1 and M2 Conformance

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PKG_DIR: docs/Hospitality_OS_Phase_1_Clean_Build_Package_v2.0.9
  # Running the package validators imports modules under docs/. Without this, Python
  # writes __pycache__/ into the pinned package, which is forbidden surface and breaks
  # byte-identity. Do not remove.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  forbidden-surface:
    name: M1 forbidden surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The README and evidence generators derive facts from commits —
          # which commit landed each slice, which commit a report describes — and a
          # shallow checkout cannot answer either. They refuse rather than guess, so this
          # is required, not an optimisation.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Put CI's own logs outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          # Anything written into the workspace shows up in `git status` as an untracked
          # file, and the evidence report records whether the tree was clean when it was
          # generated — so a `tee m1a.log` in the workspace made the report say NOT CLEAN
          # and differ from the committed copy. Same reasoning as building the API outside
          # the repository: keep the checkout pristine. RUNNER_TEMP is read here rather than
          # through the runner context in a job-level `env:`: that context is not
          # available there, and referencing it makes the whole workflow invalid.
          mkdir -p "$RUNNER_TEMP/m1-logs"
          echo "LOG_DIR=$RUNNER_TEMP/m1-logs" >> "$GITHUB_ENV"

      - name: Verify no fenced-domain surface exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          python3 tools/verify_m1.py --repo . --json-report "$LOG_DIR/m1_verification.json"

      - name: Fail closed on an absent or unparseable report
        shell: bash
        run: |
          set -euo pipefail
          test -s "$LOG_DIR/m1_verification.json" || { echo "::error::verification report absent or empty"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open(os.environ["LOG_DIR"] + "/m1_verification.json"))
          if r.get("passed") is not True:
              sys.exit("verification did not report passed=true")
          if r.get("finding_count") != 0:
              sys.exit(f"verification reported {r.get('finding_count')} finding(s)")
          if r.get("docs_files_counted") != 92:
              sys.exit(f"/docs drift: {r.get('docs_files_counted')} files, expected 92")
          if not isinstance(r.get("repository_files_scanned"), int) or r["repository_files_scanned"] < 1:
              sys.exit("no repository file was scanned — an empty scan is a failure, not a pass")
          # The vocabulary must have come from the pinned package, and must not be empty.
          # A gate scanning against zero terms passes everything while reporting success.
          if not isinstance(r.get("vocabulary_terms"), int) or r["vocabulary_terms"] < 1:
              sys.exit(f"vocabulary loaded {r.get('vocabulary_terms')} term(s)")
          if not isinstance(r.get("vocabulary_domains"), int) or r["vocabulary_domains"] < 1:
              sys.exit(f"vocabulary loaded {r.get('vocabulary_domains')} domain(s)")
          if "forbidden_surface_rules.json" not in str(r.get("vocabulary_source", "")):
              sys.exit(f"vocabulary did not come from the pinned package: {r.get('vocabulary_source')}")
          print(f"m1 forbidden-surface report is clean; "
                f"{r['vocabulary_terms']} terms across {r['vocabulary_domains']} domains "
                f"loaded from the pinned package")
          PY

      - name: The fenced gate must detect every authoritative term
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          python3 tests/fenced_gate/verify_fenced_gate.py 2>&1 | tee "$LOG_DIR/fenced_gate.log"
          grep -q '^PASS FENCED_GATE_VERIFICATION' "$LOG_DIR/fenced_gate.log" || {
            echo "::error::the fenced-domain gate suite did not report PASS"; exit 1; }
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/fenced_gate.log" | tail -1)"
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} fenced-gate check(s) failed"; exit 1; }

      - name: The committed README must match a fresh generation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_readme.py --check README.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fenced-gate-log
          path: ${{ runner.temp }}/m1-logs/fenced_gate.log
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: m1-verification-report
          path: ${{ runner.temp }}/m1-logs/m1_verification.json
          if-no-files-found: error

  windows-verification:
    name: Windows execution (M1 + M2, including the rendered surface)
    runs-on: windows-latest
    # Windows was verified once, by hand, and that run found seven defects Linux could not
    # expose — a locale-dependent decode that corrupted psql output, bash resolving to the
    # WSL launcher, an npm entry point that is not a Win32 executable, a python3 no
    # standard Windows install provides. All were repaired, but nothing stopped them
    # coming back: the suites were not run on Windows in CI, so Windows was verified by
    # execution and not guarded by it. This job is the guard (FR-OPS-021).
    #
    # It runs the SAME drivers as the Linux job, under Git Bash. Nothing here is a
    # Windows-shaped copy of the commands: a pipeline that ran a different path would
    # prove that path works, not the documented one.
    env:
      PGTCP_HOST: localhost
      PGPORT: "5432"
      SUPERUSER: pgadmin
      DB: hospitality_os
      PGPASSWORD: ""

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the README and evidence generators read commits and refuse to
          # guess from a shallow checkout.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Put CI's own logs outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1-logs"
          echo "LOG_DIR=$RUNNER_TEMP/m1-logs" >> "$GITHUB_ENV"
          echo "M1D_WORKSPACE=$RUNNER_TEMP/m1d-workspace" >> "$GITHUB_ENV"

      - name: Run a throwaway PostgreSQL from the image's binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The Linux job gets a fresh postgres:16 container per run. Windows runners
          # cannot run Linux containers, so this makes the equivalent by hand: a cluster
          # initialised into the runner temp directory, started under the runner's own
          # account, thrown away with the runner.
          #
          # The image's PostgreSQL SERVICE is deliberately not used. It refuses to start —
          # the newest line in its log is from the day the image was built, so it dies
          # before writing anything — and diagnosing a service account's rights on a
          # machine that exists for four minutes is not verification, it is archaeology.
          # Running the server ourselves also removes the need to rewrite pg_hba.conf at
          # all: initdb is told to trust from the start, which is the same posture as the
          # Linux container and keeps every credential out of the repository.
          $root = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
          if (-not $root) { throw "no PostgreSQL installation on this runner image" }
          $pgBin = Join-Path $root.FullName 'bin'
          "$pgBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $data = Join-Path $env:RUNNER_TEMP 'pgdata'
          $log  = Join-Path $env:RUNNER_TEMP 'postgres.log'
          if (Test-Path $data) { Remove-Item $data -Recurse -Force }

          # The superuser is created here, named to match SUPERUSER, so no separate
          # bootstrap step is needed and no password exists to leak.
          & "$pgBin\initdb.exe" -D "$data" -U "$env:SUPERUSER" --auth=trust --encoding=UTF8 --locale=C
          if ($LASTEXITCODE -ne 0) { throw "initdb failed" }

          & "$pgBin\pg_ctl.exe" -D "$data" -l "$log" -o "-p $env:PGPORT -h localhost" -w start
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::the server did not start"
              if (Test-Path $log) { Get-Content $log -Tail 40 | Write-Host }
              throw "pg_ctl start failed"
          }

          & "$pgBin\pg_isready.exe" -h localhost -p $env:PGPORT -t 60
          if ($LASTEXITCODE -ne 0) { throw "the server started but never accepted connections" }
          & "$pgBin\psql.exe" "postgresql://$env:SUPERUSER@localhost:$env:PGPORT/postgres" -tAc "SHOW server_version;"
          if ($LASTEXITCODE -ne 0) { throw "trust authentication is not in effect" }

      - name: Prerequisites, discovered the way the documentation says to
        shell: bash
        run: |
          set -euo pipefail
          # The documented Windows interpreter is `python`, not `python3`. Running the
          # documented command is the point: a pipeline that reached for a different one
          # would hide exactly the defect this job exists to catch.
          python tools/check_prerequisites.py

      - name: The fenced gate must detect every authoritative term
        shell: bash
        run: |
          set -euo pipefail
          python tests/fenced_gate/verify_fenced_gate.py 2>&1 | tee "$LOG_DIR/fenced_gate.log"
          grep -q '^PASS FENCED_GATE_VERIFICATION' "$LOG_DIR/fenced_gate.log" || {
            echo "::error::the fenced-domain gate suite did not report PASS on Windows"; exit 1; }

      - name: Verify no fenced-domain surface exists
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_m1.py --repo . --json-report "$LOG_DIR/m1_verification.json"

      - name: Install the browser M2-C renders in
        shell: bash
        run: |
          set -euo pipefail
          export M1D_WORKSPACE="$RUNNER_TEMP/m1d-workspace"
          echo "M1D_WORKSPACE=$M1D_WORKSPACE" >> "$GITHUB_ENV"
          bash api/build.sh
          cd "$M1D_WORKSPACE"
          # No --with-deps here: that flag installs Linux system packages and is a no-op
          # at best on Windows. Same pinned Chromium build either way.
          ./node_modules/.bin/playwright install chromium

      - name: Every suite, through the same drivers Linux runs
        shell: bash
        run: |
          set -euo pipefail
          # PYTHON is exported so the drivers do not have to guess; they would resolve it
          # themselves, and the fallback is tested on this runner by the fact that
          # check_prerequisites.py ran under the documented name above.
          export PYTHON=python
          bash tests/m3c/run_verification.sh 2>&1 | tee "$LOG_DIR/windows-suites.log"
          for verdict in M1A M1B M1C M1D M2A M2B M2C M3A; do
            grep -q "^PASS ${verdict}_VERIFICATION" "$LOG_DIR/windows-suites.log" || {
              echo "::error::${verdict} did not report PASS on Windows"; exit 1; }
          done
          total="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/windows-suites.log" \
                   | awk '{s+=$1} END {print s}')"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/windows-suites.log" \
                    | awk '{s+=$1} END {print s}')"
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} check(s) failed on Windows"; exit 1; }
          echo "Windows: $total checks across five suites, 0 failures"

      - name: The generators must produce identical output on Windows
        shell: bash
        run: |
          set -euo pipefail
          # A generator that emits different bytes here would make the committed artefact
          # depend on which platform last regenerated it. cp1252 decoding already caused
          # exactly that once, reporting drift against a schema that had not drifted.
          python tools/generate_readme.py --check README.md
          python tools/generate_schema_catalog.py \
            --dsn "postgresql://$SUPERUSER@$PGTCP_HOST:$PGPORT/$DB" \
            --check schema/SCHEMA_CATALOG.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-suite-logs
          path: ${{ runner.temp }}/m1-logs/
          if-no-files-found: warn

  docs-package-integrity:
    name: Docs package integrity (91/91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the pinned package is byte-identical
        shell: bash
        run: |
          set -euo pipefail
          test -d "$PKG_DIR" || { echo "::error::pinned package directory is absent"; exit 1; }
          test "$(find "$PKG_DIR" -type f | wc -l)" -eq 92 || {
            echo "::error::expected exactly 92 files under the package"; exit 1; }
          cd "$PKG_DIR"
          test -s SHA256SUMS.txt || { echo "::error::SHA256SUMS.txt absent or empty"; exit 1; }

          mkdir -p "$RUNNER_TEMP/m1-logs"
          expected="$(grep -c '^[0-9a-f]\{64\}[ *]' SHA256SUMS.txt)"
          if [ "$expected" -ne 91 ]; then
            echo "::error::expected 91 checksum lines, found $expected"
            exit 1
          fi

          log="$RUNNER_TEMP/m1-logs/sha256-check.log"
          sha256sum -c SHA256SUMS.txt | tee "$log"
          ok="$(grep -c ': OK$' "$log")"
          if [ "$ok" -ne 91 ]; then
            echo "::error::expected 91 OK results, found $ok"
            exit 1
          fi
          echo "docs package verified: 91/91 OK, 0 failures"

  database-verification:
    name: Database, identity, configuration and API (M1-A through M1-D)
    runs-on: ubuntu-latest
    # The evidence report is the aggregate record and must account for every suite. The
    # fenced-gate suite runs in the job above, on a different runner, so this job waits
    # for it and collects its log rather than reporting it as "not run".
    needs: forbidden-surface

    services:
      postgres:
        image: postgres:16
        env:
          # Trust auth on an ephemeral, job-local container. This is what keeps every
          # credential out of the repository: there is no password to check in.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: pgadmin
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pgadmin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGTCP_HOST: localhost
      PGPORT: "5432"
      SUPERUSER: pgadmin
      DB: hospitality_os

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The README and evidence generators derive facts from commits —
          # which commit landed each slice, which commit a report describes — and a
          # shallow checkout cannot answer either. They refuse rather than guess, so this
          # is required, not an optimisation.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      - name: Put CI's own logs outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          # Anything written into the workspace shows up in `git status` as an untracked
          # file, and the evidence report records whether the tree was clean when it was
          # generated — so a `tee m1a.log` in the workspace made the report say NOT CLEAN
          # and differ from the committed copy. Same reasoning as building the API outside
          # the repository: keep the checkout pristine. RUNNER_TEMP is read here rather than
          # through the runner context in a job-level `env:`: that context is not
          # available there, and referencing it makes the whole workflow invalid.
          mkdir -p "$RUNNER_TEMP/m1-logs"
          echo "LOG_DIR=$RUNNER_TEMP/m1-logs" >> "$GITHUB_ENV"

      - name: M1-A — migrations, organizational model, RLS, negative controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          bash tests/m1a/run_verification.sh 2>&1 | tee "$LOG_DIR/m1a.log"
          grep -q '^PASS M1A_VERIFICATION' "$LOG_DIR/m1a.log" || {
            echo "::error::M1-A suite did not report PASS"; exit 1; }
          # A suite that ran nothing is a failure, not a pass.
          checks="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/m1a.log" | tail -1)"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/m1a.log" | tail -1)"
          test "${checks:-0}" -ge 30 || { echo "::error::only ${checks:-0} M1-A checks ran"; exit 1; }
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} M1-A check(s) failed"; exit 1; }
          echo "M1-A: $checks checks, 0 failures"

      - name: M1-B — identity, memberships, sessions, step-up, principals
        shell: bash
        run: |
          set -euo pipefail
          bash tests/m1b/run_verification.sh 2>&1 | tee "$LOG_DIR/m1b.log"
          grep -q '^PASS M1B_VERIFICATION' "$LOG_DIR/m1b.log" || {
            echo "::error::M1-B suite did not report PASS"; exit 1; }
          checks="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/m1b.log" | tail -1)"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/m1b.log" | tail -1)"
          test "${checks:-0}" -ge 25 || { echo "::error::only ${checks:-0} M1-B checks ran"; exit 1; }
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} M1-B check(s) failed"; exit 1; }
          echo "M1-B: $checks checks, 0 failures"

      - name: M1-C — configuration, audit, money, quantity, numbering, retention
        shell: bash
        run: |
          set -euo pipefail
          bash tests/m1c/run_verification.sh 2>&1 | tee "$LOG_DIR/m1c.log"
          grep -q '^PASS M1C_VERIFICATION' "$LOG_DIR/m1c.log" || {
            echo "::error::M1-C suite did not report PASS"; exit 1; }
          checks="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/m1c.log" | tail -1)"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/m1c.log" | tail -1)"
          test "${checks:-0}" -ge 45 || { echo "::error::only ${checks:-0} M1-C checks ran"; exit 1; }
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} M1-C check(s) failed"; exit 1; }
          echo "M1-C: $checks checks, 0 failures"

      - name: Install Node and build the API outside the repository
        shell: bash
        run: |
          set -euo pipefail
          # The build writes node_modules/ and dist/ into $M1D_WORKSPACE, never into the
          # checkout: tools/verify_m1.py treats those directories as forbidden surface and
          # inspects the filesystem, so a build inside the repository would fail the gate.
          echo "M1D_WORKSPACE=$RUNNER_TEMP/m1d-workspace" >> "$GITHUB_ENV"

      - name: Install the browser M2-C renders in
        shell: bash
        run: |
          set -euo pipefail
          # M2-C's claims about right-to-left layout, contrast and clipping are facts about
          # rendered pixels, so CI needs a real browser to read them out of. playwright is
          # pinned in api/package.json and this fetches exactly the Chromium build that pin
          # expects, on both platforms, so the two runners render in the same engine.
          # --with-deps installs the system libraries Chromium needs on a Linux runner; the
          # Windows job runs the same command without it.
          export M1D_WORKSPACE="$RUNNER_TEMP/m1d-workspace"
          bash api/build.sh
          cd "$M1D_WORKSPACE"
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: M1-D — API surface, security controls, operations, evidence
        shell: bash
        run: |
          set -euo pipefail
          # No pre-seed here: tests/m1d/run_verification.sh rebuilds the database and
          # then seeds through the runner. Seeding first only created a record that the
          # rebuild discarded.
          bash tests/m1d/run_verification.sh 2>&1 | tee "$LOG_DIR/m1d.log"
          grep -q '^PASS M1D_VERIFICATION' "$LOG_DIR/m1d.log" || {
            echo "::error::M1-D suite did not report PASS"; exit 1; }
          checks="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/m1d.log" | tail -1)"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/m1d.log" | tail -1)"
          test "${checks:-0}" -ge 40 || { echo "::error::only ${checks:-0} M1-D checks ran"; exit 1; }
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} M1-D check(s) failed"; exit 1; }
          echo "M1-D: $checks checks, 0 failures"

      - name: M2-A — menu, pricing, availability and translation storage
        shell: bash
        run: |
          set -euo pipefail
          # Chains from the M1-D driver, which rebuilds the database from empty and seeds
          # through the runner, so M2-A never asserts against state it did not see created.
          bash tests/m2a/run_verification.sh 2>&1 | tee "$LOG_DIR/m2a.log"
          grep -q '^PASS M2A_VERIFICATION' "$LOG_DIR/m2a.log" || {
            echo "::error::M2-A suite did not report PASS"; exit 1; }
          checks="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/m2a.log" | tail -1)"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/m2a.log" | tail -1)"
          test "${checks:-0}" -ge 65 || { echo "::error::only ${checks:-0} M2-A checks ran"; exit 1; }
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} M2-A check(s) failed"; exit 1; }
          echo "M2-A: $checks checks, 0 failures"

      - name: M2-B — tables, QR, guest sessions, carts and allergen safety
        shell: bash
        run: |
          set -euo pipefail
          # Chains from the M2-A driver for the same reason M2-A chains from M1-D: an
          # allergen declaration is a statement about a menu item, so the item has to have
          # been created by a run this suite watched.
          bash tests/m2b/run_verification.sh 2>&1 | tee "$LOG_DIR/m2b.log"
          grep -q '^PASS M2B_VERIFICATION' "$LOG_DIR/m2b.log" || {
            echo "::error::M2-B suite did not report PASS"; exit 1; }
          checks="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/m2b.log" | tail -1)"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/m2b.log" | tail -1)"
          test "${checks:-0}" -ge 95 || { echo "::error::only ${checks:-0} M2-B checks ran"; exit 1; }
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} M2-B check(s) failed"; exit 1; }
          echo "M2-B: $checks checks, 0 failures"

      - name: M2-C — customer surface, three languages, Arabic RTL, accessibility
        shell: bash
        run: |
          set -euo pipefail
          # Chains from the M2-B driver. The surface renders a published menu with approved
          # allergen warnings in three languages, which is M2-A's translation workflow and
          # M2-B's safety catalog arriving on a screen — a suite that started here would be
          # rendering a database nobody had proved.
          bash tests/m2c/run_verification.sh 2>&1 | tee "$LOG_DIR/m2c.log"
          grep -q '^PASS M2C_VERIFICATION' "$LOG_DIR/m2c.log" || {
            echo "::error::M2-C suite did not report PASS"; exit 1; }
          checks="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/m2c.log" | tail -1)"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/m2c.log" | tail -1)"
          test "${checks:-0}" -ge 55 || { echo "::error::only ${checks:-0} M2-C checks ran"; exit 1; }
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} M2-C check(s) failed"; exit 1; }
          # A rendering suite that quietly stopped rendering would still report PASS on the
          # checks it did run, so the split between browser-measured and asserted evidence
          # is guarded too. Read from the figure the suite DERIVES from its own results,
          # not by counting printed lines here: a count assembled in two places drifts in
          # one of them, which is how the reported split came to be wrong.
          measured="$(grep -oP 'measured\s+:\s+\K[0-9]+' "$LOG_DIR/m2c.log" | tail -1)"
          test "${measured:-0}" -ge 40 || {
            echo "::error::only ${measured:-0} M2-C checks were browser-measured"; exit 1; }
          echo "M2-C: $checks checks, 0 failures, $measured of them measured in a real browser"

      - name: M3-A — orders, snapshots, notes, ledger, session lifecycle
        shell: bash
        run: |
          set -euo pipefail
          # Chains from the M2-C driver. An order is the moment every earlier gate becomes
          # binding at once: exact money types, an immutable publication snapshot, a live
          # allergen catalog and a locale snapshot all arrive together in a row somebody
          # can be charged for.
          bash tests/m3a/run_verification.sh 2>&1 | tee "$LOG_DIR/m3a.log"
          grep -q '^PASS M3A_VERIFICATION' "$LOG_DIR/m3a.log" || {
            echo "::error::M3-A suite did not report PASS"; exit 1; }
          checks="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/m3a.log" | tail -1)"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/m3a.log" | tail -1)"
          test "${checks:-0}" -ge 125 || { echo "::error::only ${checks:-0} M3-A checks ran"; exit 1; }
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} M3-A check(s) failed"; exit 1; }
          # The differential that proves a retry has no second effect enumerates its
          # tables from the catalog, so it silently covers fewer tables if the catalog
          # query ever stops matching. Guarded by the figure the suite prints itself.
          grep -qE 'changed NOTHING, anywhere in the database' "$LOG_DIR/m3a.log" || {
            echo "::error::the idempotency differential did not report"; exit 1; }
          tables="$(grep -oP 'compared \K[0-9]+(?= tables)' "$LOG_DIR/m3a.log" | tail -1)"
          test "${tables:-0}" -ge 80 || {
            echo "::error::the retry differential covered only ${tables:-0} tables"; exit 1; }
          echo "M3-A: $checks checks, 0 failures, retry differential over $tables tables"

      - name: M3-B — fulfillment, tickets, stations, the KDS, the state machine
        shell: bash
        run: |
          set -euo pipefail
          # Chains from the M3-A driver. A kitchen ticket is where M2-B's live allergen
          # catalog and M3-A's surviving declaration have to arrive on a screen somebody
          # cooks from, so the chain is the point rather than an inconvenience.
          bash tests/m3b/run_verification.sh 2>&1 | tee "$LOG_DIR/m3b.log"
          grep -q '^PASS M3B_VERIFICATION' "$LOG_DIR/m3b.log" || {
            echo "::error::M3-B suite did not report PASS"; exit 1; }
          checks="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/m3b.log" | tail -1)"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/m3b.log" | tail -1)"
          test "${checks:-0}" -ge 95 || { echo "::error::only ${checks:-0} M3-B checks ran"; exit 1; }
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} M3-B check(s) failed"; exit 1; }
          # The state machine is read from the pinned package at run time and the suite
          # fails closed if it cannot read it. Guarded here too, because a suite that
          # quietly walked ten states would still report PASS on the ten it walked.
          grep -qE 'SM-FULFILLMENT-TICKET loaded from the pinned package: 11 states' \
            "$LOG_DIR/m3b.log" || {
            echo "::error::the pinned ticket state machine did not load with 11 states"; exit 1; }
          pairs="$(grep -oP '[0-9]+(?= ordered pairs attempted)' "$LOG_DIR/m3b.log" | tail -1)"
          test "${pairs:-0}" -ge 110 || {
            echo "::error::only ${pairs:-0} ordered state pairs were attempted"; exit 1; }
          # The safety claim is a claim about a screen, so a run that stopped rendering
          # must not pass on its database checks alone.
          measured="$(grep -oP 'measured\s+:\s+\K[0-9]+' "$LOG_DIR/m3b.log" | tail -1)"
          test "${measured:-0}" -ge 8 || {
            echo "::error::only ${measured:-0} M3-B checks were browser-measured"; exit 1; }
          echo "M3-B: $checks checks, 0 failures, $pairs state pairs, $measured measured"

      - name: M3-C — service requests, notifications, integration runtime
        shell: bash
        run: |
          set -euo pipefail
          # Chains from the M3-B driver. A service request needs a seated guest from
          # M2-B, a chosen language from M2-C, an order to be beside from M3-A and a
          # kitchen already busy from M3-B.
          bash tests/m3c/run_verification.sh 2>&1 | tee "$LOG_DIR/m3c.log"
          grep -q '^PASS M3C_VERIFICATION' "$LOG_DIR/m3c.log" || {
            echo "::error::M3-C suite did not report PASS"; exit 1; }
          checks="$(grep -oP 'checks run\s+:\s+\K[0-9]+' "$LOG_DIR/m3c.log" | tail -1)"
          failed="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/m3c.log" | tail -1)"
          test "${checks:-0}" -ge 100 || { echo "::error::only ${checks:-0} M3-C checks ran"; exit 1; }
          test "${failed:-1}" -eq 0 || { echo "::error::${failed} M3-C check(s) failed"; exit 1; }
          # The machine and the event catalog are read from the pinned package at run
          # time and the suite fails closed if it cannot read them. Guarded here too,
          # because a suite that quietly walked eight states would still report PASS.
          grep -qE 'SM-SERVICE-REQUEST loaded from the pinned package: 9 states' \
            "$LOG_DIR/m3c.log" || {
            echo "::error::the pinned service request machine did not load with 9 states"; exit 1; }
          pairs="$(grep -oP '[0-9]+(?= ordered pairs attempted)' "$LOG_DIR/m3c.log" | tail -1)"
          test "${pairs:-0}" -ge 72 || {
            echo "::error::only ${pairs:-0} ordered state pairs were attempted"; exit 1; }
          # The language and staff-identity claims are claims about a screen.
          measured="$(grep -oP 'measured\s+:\s+\K[0-9]+' "$LOG_DIR/m3c.log" | tail -1)"
          test "${measured:-0}" -ge 5 || {
            echo "::error::only ${measured:-0} M3-C checks were browser-measured"; exit 1; }
          echo "M3-C: $checks checks, 0 failures, $pairs state pairs, $measured measured"

      - name: The partial-closure register must agree with the repository
        shell: bash
        run: |
          set -euo pipefail
          # Structural, like SLICE_UNDESCRIBED. An entry with no completing gate, one
          # naming a gate the requirements register does not have, or one still open
          # after its completer has landed, all stop the build here — independently of
          # the README generator, which checks the same register through its own path.
          python3 tools/partial_closures.py

      - name: Results must be identical regardless of command order (FR-TST-020)
        shell: bash
        run: |
          set -euo pipefail
          export M1A_ADMIN_DSN="postgresql://$SUPERUSER@$PGTCP_HOST:$PGPORT/$DB"
          export M1A_APP_DSN="postgresql://hospitality_app@$PGTCP_HOST:$PGPORT/$DB"
          export M1A_MIGRATOR_DSN="postgresql://hospitality_migrator@$PGTCP_HOST:$PGPORT/$DB"
          export M1A_PRIVILEGED_DSN="postgresql://hospitality_bypassrls@$PGTCP_HOST:$PGPORT/$DB"
          mkdir -p "$LOG_DIR/reorder"
          # Reverse order, same database, no rebuild. A suite that only passes when it runs
          # first is depending on state another suite left behind.
          for suite in m3c m3b m3a m2c m2b m2a m1d m1c m1b m1a; do
            python3 "tests/$suite/verify_${suite}.py" > "$LOG_DIR/reorder/$suite.log" 2>&1 || true
          done
          fail=0
          for suite in m1a m1b m1c m1d m2a m2b m2c m3a m3b m3c; do
            tag="$(echo "$suite" | tr '[:lower:]' '[:upper:]')"
            declared="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/$suite.log" | tail -1)"
            reordered="$(grep -oP 'failed\s+:\s+\K[0-9]+' "$LOG_DIR/reorder/$suite.log" | tail -1)"
            verdict="$(grep -cE "^PASS ${tag}_VERIFICATION" "$LOG_DIR/reorder/$suite.log" || true)"
            if [ "${declared:-x}" != "${reordered:-y}" ] || [ "${verdict:-0}" -lt 1 ]; then
              echo "::error::$suite differs under a reordered run (declared=$declared reordered=$reordered)"
              fail=1
            else
              echo "$suite: identical under reordering ($declared failures either way)"
            fi
          done
          test "$fail" -eq 0

      - name: Collect the fenced-gate log from the job that ran it
        uses: actions/download-artifact@v4
        with:
          name: fenced-gate-log
          path: ${{ runner.temp }}/m1-logs/collected

      - name: Regenerate and check the M1 evidence report (FR-TST-016)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR/evidence-logs"
          cp "$LOG_DIR"/m1a.log "$LOG_DIR"/m1b.log "$LOG_DIR"/m1c.log "$LOG_DIR"/m1d.log \
             "$LOG_DIR"/m2a.log "$LOG_DIR"/m2b.log "$LOG_DIR"/m2c.log \
             "$LOG_DIR"/m3a.log "$LOG_DIR"/m3b.log "$LOG_DIR"/m3c.log \
             "$LOG_DIR/evidence-logs/"
          # No "|| true" here. A missing suite log must stop the report, not silently
          # become a "not run" row with a wrong total.
          cp "$LOG_DIR/collected/fenced_gate.log" "$LOG_DIR/evidence-logs/fenced_gate.log"
          python3 tools/generate_evidence_report.py \
            --dsn "postgresql://$SUPERUSER@$PGTCP_HOST:$PGPORT/$DB" \
            --logs "$LOG_DIR/evidence-logs" --out "$LOG_DIR/regenerated_report.md"

          # Same discipline as the migration and seed checksum locks: a report that no
          # longer describes what it ships with is worse than no report, so a difference
          # fails the build rather than being silently carried to the next gate.
          if ! diff -u evidence/M1_EVIDENCE_REPORT.md "$LOG_DIR/regenerated_report.md"; then
            echo "::error::the committed evidence report differs from a fresh regeneration"
            exit 1
          fi
          grep -q 'red, then green' evidence/M1_EVIDENCE_REPORT.md
          test "$(grep -c 'not proven' evidence/M1_EVIDENCE_REPORT.md)" -eq 0 || {
            echo "::error::the evidence report lists a control that was not proven"; exit 1; }
          echo "the committed evidence report equals a fresh regeneration"

      - name: The committed schema catalog must match the live schema
        shell: bash
        run: |
          set -euo pipefail
          # Regenerated independently of the suite, so a catalog that drifted cannot be
          # carried by a passing test elsewhere.
          python3 tools/generate_schema_catalog.py \
            --dsn "postgresql://$SUPERUSER@$PGTCP_HOST:$PGPORT/$DB" \
            --check schema/SCHEMA_CATALOG.md

      - name: Every negative control must have been proved red before green
        shell: bash
        run: |
          set -euo pipefail
          # A control that never went red is a coverage gap wearing a green badge.
          for control in NC-M1-001 NC-M1-002 NC-M1-003 NC-M1-004 \
                         NC-M1B-001 NC-M1B-002 NC-M1B-003 NC-M1B-004 NC-M1B-005 \
                         NC-M1C-001 NC-M1C-002 NC-M1C-003 NC-M1C-004 NC-M1C-005 \
                         NC-M1D-001 NC-M1D-002 NC-M1D-003 NC-M1D-004 NC-M1D-005 \
                         NC-M1D-006 NC-M1D-007 NC-M1D-008 \
                         NC-M2A-001 NC-M2A-002 NC-M2A-003 NC-M2A-004 NC-M2A-005 \
                         NC-M2-001 NC-M2-002 NC-M2-003 \
                         NC-M2B-004 NC-M2B-005 NC-M2B-006 NC-M2B-007 NC-M2B-008 \
                         NC-M2B-009 NC-M2B-010 \
                         NC-M2-004 NC-M2C-005 NC-M2C-006 NC-M2C-007 NC-M2C-008 \
                         NC-M2C-009 NC-M2C-010 \
                         NC-M3-001 NC-M3-002 NC-M3-003 NC-M3-005 NC-M3-006 \
                         NC-M3-007 NC-M3-008 NC-M3-009 \
                         NC-M3-004 NC-M3B-001 NC-M3B-002 NC-M3B-003 \
                         NC-M3B-004 NC-M3B-005 NC-M3B-006 \
                         NC-M3C-001 NC-M3C-002 NC-M3C-003 NC-M3C-004 \
                         NC-M3C-005 NC-M3C-006 NC-M3C-007; do
            red="$(grep -cE "\[PASS\] (\([a-z]+\) )?$control — RED" "$LOG_DIR"/m1a.log "$LOG_DIR"/m1b.log "$LOG_DIR"/m1c.log "$LOG_DIR"/m1d.log "$LOG_DIR"/m2a.log "$LOG_DIR"/m2b.log "$LOG_DIR"/m2c.log "$LOG_DIR"/m3a.log "$LOG_DIR"/m3b.log "$LOG_DIR"/m3c.log | awk -F: '{s+=$2} END {print s}')"
            green="$(grep -cE "\[PASS\] (\([a-z]+\) )?$control — GREEN" "$LOG_DIR"/m1a.log "$LOG_DIR"/m1b.log "$LOG_DIR"/m1c.log "$LOG_DIR"/m1d.log "$LOG_DIR"/m2a.log "$LOG_DIR"/m2b.log "$LOG_DIR"/m2c.log "$LOG_DIR"/m3a.log "$LOG_DIR"/m3b.log "$LOG_DIR"/m3c.log | awk -F: '{s+=$2} END {print s}')"
            if [ "${red:-0}" -lt 1 ] || [ "${green:-0}" -lt 1 ]; then
              echo "::error::$control was not shown both red and green (red=$red green=$green)"
              exit 1
            fi
            echo "$control: proved red then green"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-suite-logs
          path: |
            ${{ runner.temp }}/m1-logs/m1a.log
            ${{ runner.temp }}/m1-logs/m1b.log
            ${{ runner.temp }}/m1-logs/m1c.log
            ${{ runner.temp }}/m1-logs/m1d.log
            ${{ runner.temp }}/m1-logs/m2a.log
            ${{ runner.temp }}/m1-logs/m2b.log
            ${{ runner.temp }}/m1-logs/m2c.log
            ${{ runner.temp }}/m1-logs/m3a.log
            ${{ runner.temp }}/m1-logs/m3b.log
            ${{ runner.temp }}/m1-logs/m3c.log
            ${{ runner.temp }}/m1-logs/reorder/
            evidence/M1_EVIDENCE_REPORT.md
          if-no-files-found: error

  occurrence-registry:
    name: Forbidden-occurrence registry validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provide a nested temp root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1/tmp/work"
          echo "TMPDIR=$RUNNER_TEMP/m1/tmp/work" >> "$GITHUB_ENV"

      - name: Run the occurrence validator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1-logs"
          validator="$PKG_DIR/06_TOOLS/frozen_validator/forbidden_occurrence_validator.py"
          test -f "$validator" || { echo "::error::occurrence validator absent at $validator"; exit 1; }

          python3 "$validator" "$PKG_DIR" 2>&1 | tee "$RUNNER_TEMP/m1-logs/occurrence.log"
          test -s "$RUNNER_TEMP/m1-logs/occurrence.log" || { echo "::error::validator produced no output"; exit 1; }

          grep -qx 'PASS FORBIDDEN_OCCURRENCE_REGISTRY_VALID' "$RUNNER_TEMP/m1-logs/occurrence.log" || {
            echo "::error::validator did not emit PASS FORBIDDEN_OCCURRENCE_REGISTRY_VALID"
            exit 1
          }

          python3 - <<'PY'
          import json, os, re, sys
          text = open(os.environ["RUNNER_TEMP"] + "/m1-logs/occurrence.log", encoding="utf-8").read()
          m = re.search(r"\{.*\}", text, re.S)
          if not m:
              sys.exit("validator emitted no JSON result block — unknown status is a failure")
          r = json.loads(m.group(0))
          if r.get("passed") is not True:
              sys.exit(f"validator reported passed={r.get('passed')!r}")
          if r.get("failure_count") != 0:
              sys.exit(f"validator reported {r.get('failure_count')} failure(s)")
          print("occurrence registry valid: passed=true, failure_count=0")
          PY

  mechanism-suite:
    name: Occurrence mechanism suite (28/28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provide a nested temp root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1/tmp/work"
          echo "TMPDIR=$RUNNER_TEMP/m1/tmp/work" >> "$GITHUB_ENV"

      - name: Run the mechanism suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m1-logs"
          suite="$PKG_DIR/06_TOOLS/test_occurrence_mechanism.py"
          test -f "$suite" || { echo "::error::mechanism suite absent at $suite"; exit 1; }

          python3 "$suite" --package "$PKG_DIR" 2>&1 | tee "$RUNNER_TEMP/m1-logs/mechanism.log"
          test -s "$RUNNER_TEMP/m1-logs/mechanism.log" || { echo "::error::suite produced no output"; exit 1; }

          if grep -Eqi '\b(skipped|deselected|no tests (ran|collected))\b' "$RUNNER_TEMP/m1-logs/mechanism.log"; then
            echo "::error::suite reported skipped or zero-collected cases"
            exit 1
          fi

          grep -q '^28/28 correct' "$RUNNER_TEMP/m1-logs/mechanism.log" || {
            echo "::error::mechanism suite did not report 28/28 correct"
            exit 1
          }
          echo "mechanism suite: 28/28 correct"
